# ==============================================================================
# audio-transcriber 設定ファイル例 (config.example.toml)
# このファイルを config.toml としてコピーして使用します。
# ==============================================================================

# ==============================================================================
# パス設定
# ==============================================================================
[path]
# 出力先ディレクトリ
OUTPUT_DIR = "./output"

# デフォルトの入力動画パス（省略時は CLI 引数で指定）
DEFAULT_VIDEO_PATH = "data/test_videos/sample.mov"

# デバッグ用出力ディレクトリ
DEBUG_OUTPUT_DIR = "debug_output"

# カスタム辞書（表記揺れ・ユーザー指定用語）のパス
CUSTOM_DICT_PATH = "data/custom_dictionary.toml"

# ==============================================================================
# パイプライン設定
# ==============================================================================
[pipeline]
# 動画再結合（クリーン音声でマイク音声を置換した動画を生成）を行うか
REMUX = true

# ==============================================================================
# ノイズ除去設定 (Denoise)
# ==============================================================================
[denoise]
# ノイズ除去処理を有効にするか (True / False)
ENABLED = true

# 使用するノイズ除去エンジン ("rnnoise", "resemble_enhance" 等)
ENGINE = "rnnoise"

# カスタムモデルパス (RNNoise モデル: "data/models/sh.rnnn", "data/models/cb.rnnn" 等)
MODEL_PATH = "data/models/sh.rnnn"

# ==============================================================================
# メディア・トラック設定
# ==============================================================================
[media]
# マルチトラック動画内のマイク音声トラック番号 (1-indexed)
MIC_TRACK = 2

# 抽出・処理時のサンプリングレート (Hz)
SAMPLE_RATE = 48000

# ==============================================================================
# Whisper 推論モデル・デバイス設定
# ==============================================================================
[model]
# モデルサイズ: "tiny", "base", "small", "medium", "large-v3", "large-v3-turbo"
MODEL_SIZE = "small"

# 実行デバイス: "cuda" または "cpu"
DEVICE = "cuda"

# 量子化タイプ: "float16", "int8_float16", "int8", "float32"
COMPUTE_TYPE = "float16"

# ==============================================================================
# 文字起こし・Whisper推論設定
# ==============================================================================
[transcribe]
# 言語コード ("ja", "en" 等)
LANGUAGE = "ja"

# ビームサーチ幅 (候補探索数。デフォルト: 5)
BEAM_SIZE = 5

# 直前文脈への依存 (True / False)
CONDITION_ON_PREVIOUS_TEXT = true

# 無音判定閾値 (0.0〜1.0, デフォルト: 0.6)
NO_SPEECH_THRESHOLD = 0.6

# Whisper コンテキスト誘導用プロンプト（固有名詞・ゲーム用語・挨拶など）
INITIAL_PROMPT = """
以下はゲーム実況の音声です。
用語: Apex Legends, ヴァルキリー, クレーバー, ノックダウン
"""

# ==============================================================================
# VAD (Silero-VAD 音声区間検出) 設定
# ==============================================================================
[transcribe.vad]
# VAD フィルタを有効にするか
VAD_FILTER = true

# 発話区切りと判定する最小無音区間 (ミリ秒)
MIN_SILENCE_DURATION_MS = 500

# VAD 検出閾値 (0.0〜1.0, デフォルト: 0.5)
VAD_THRESHOLD = 0.5

# ==============================================================================
# テキスト後処理設定
# ==============================================================================
[post_process]
# カスタム辞書による用語置換を行うか
REPLACE_TERMS = true

# 英字を小文字化するか
LOWER = false

# 句読点等の記号を削除するか
REMOVE_PUNCT = false

# ハルシネーション（無音捏造）判定の無音確率閾値 (0.0〜1.0)
NO_SPEECH_THRESHOLD = 0.6

# 異常発話速度判定の上限文字数/秒 (人間の解剖学的限界に基づくフィルタ)
MAX_CHARS_PER_SECOND = 12.0

# ==============================================================================
# 字幕表示タイミング調整・出力フォーマット設定
# ==============================================================================
[subtitle]
# 発話終了後の余韻表示秒数 (発声終了後に字幕を残す時間)
END_PADDING = 1.0

# 字幕の最小表示秒数 (短い発言でも読み取れる最低時間)
MIN_DURATION = 1.5

# 連続する字幕セグメント間の最小隙間秒数 (次セグメントとの重複防止)
MIN_GAP = 0.05

# 出力字幕フォーマットリスト ("srt", "vtt", "json")
FORMATS = ["srt", "vtt", "json"]

# ==============================================================================
# ストリーミング設定
# ==============================================================================
[stream]
# ストリーミングチャンクのサイズ (ミリ秒)
CHUNK_SIZE_MS = 100

# バッファの最大保持秒数
BUFFER_SIZE_SECONDS = 10.0

# サンプリングレート (Hz)
SAMPLE_RATE = 16000

# 音声入力途絶時に残存バッファをフラッシュするまでのタイムアウト (ミリ秒)
FLUSH_TIMEOUT_MS = 1000

# 単語間の無音ギャップによるセグメント強制分割秒数
WORD_GAP_SPLIT_THRESHOLD = 1.0

# リアルタイムログ出力モード (true=ツリー表示, false=生テキストのシンプル出力)
STREAMING_LOG = false

# 発話切り出しの最小チャンク長 (秒)
CHUNK_MIN_SECONDS = 1.0

# 強制切り出しを行う最大チャンク長 (秒)
CHUNK_MAX_SECONDS = 30.0

[stream.context]
# 保持する過去の文脈（プロンプト）の最大文字数
CONTEXT_MAX_LENGTH = 200

# 音声入力途絶時に文脈をクリアするタイムアウト時間 (秒)
CONTEXT_TIMEOUT_SECONDS = 3.0

# ==============================================================================
# マスタリング前処理設定 (Mastering)
# ==============================================================================
[mastering]
# マスタリング処理を有効にするか (True / False)
ENABLED = false

# ノイズゲート閾値 (例: 0.04)
NOISE_GATE_THRESHOLD = 0.04

# ノーマライズ目標ラウドネス LUFS (例: -16.0)
LOUDNESS_I = -16.0

# トゥルーピークリミット dBTP (例: -2.0)
LOUDNESS_TP = -2.0

# ラウドネスレンジ LU (例: 11.0)
LOUDNESS_LRA = 11.0

# 最終ハードリミッター上限 dB (例: -2.0)
FINAL_LIMIT_DB = -2.0
