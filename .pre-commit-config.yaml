fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c "export PATH=$PATH:/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin && uv run ruff check --fix ."
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: bash -c "export PATH=$PATH:/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin && uv run ruff format ."
        language: system
        pass_filenames: false
        always_run: true

      - id: basedpyright
        name: basedpyright
        entry: bash -c "export PATH=$PATH:/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin && uv run basedpyright"
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: bash -c "export PATH=$PATH:/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin && uv run pytest --cov=audio_transcriber --cov-report=term-missing"
        language: system
        pass_filenames: false
        always_run: true
